# =============================================================================
# miniQMT 自动买入模块 (miniqmt_autobuy) 配置文件
# 格式: INI (configparser)。修改后重启 autobuy 进程生效。
# 由 miniqmt.bat 菜单 [j] 启动 / [k] 停止 / [l] 状态 / [m] 日志。
# =============================================================================

[web]
# 目标账号的 web_server 地址。多账号时改端口 (5000/5001/...)。
base_url = http://127.0.0.1:5000
# 对应主程序环境变量 QMT_API_TOKEN。web 未启用鉴权时留空。
api_token =
# HTTP 请求超时(秒)
timeout = 8

[pool]
# 候选池所在 SQLite 文件
db_path = C:\github-repo\stockquant\chan.db
# 候选池表名 (多表并集，逗号分隔)。每表各自取运行日前 N 个交易日后合并去重。
# 两表列名需一致 (code_column / date_column)
tables = stg_chan, zs_pool
# 股票代码字段 (候选池格式如 sh.600025，会自动转成系统标准 600025.SH)
code_column = code
# 日期字段 (标准日期文本 YYYY-MM-DD)
date_column = date
# 取运行日前最近 N 个交易日的股票。比如运行日为周日 2026-06-14 时，
# latest_n_dates=2 会筛选 2026-06-12 和 2026-06-11 两个交易日。
# 注意: 数据批量较大时 (如 stg_chan 单日可达数百只)，可设为 1 只取前一交易日。
latest_n_dates = 2

[filter]
# --- 大盘指数门禁 ---
# 自动买入前固定检查 999999 / 399001 / 399005。
# 至少一个指数 MA5 向上才继续执行个股筛选和下单；三者都不向上则本轮不买入。

# --- 换手率条件 (用户举例"成交量大于5%" = 换手率) ---
enable_turnover_rate = true
min_turnover_rate = 0.05
# 成交量单位换算系数: 数据源 volume 为"手"时填 100(转成股); 已是"股"填 1。
volume_unit_multiplier = 100

# --- 盘中累计量比 (默认关闭) ---
# 口径: 当日【累计】成交量 / 前5个完整交易日均量。分子是盘中累计、分母是全天均量，
# 时间跨度不对等 —— 盘中早段必然偏低(10:00 时累计量可能只有均量的 30%)，
# 会把买入窗口隐式挤压到尾盘。已由下方"近N日量比"取代。
enable_volume_ratio = false
min_volume_ratio = 2.0

# --- 近 N 日收盘量比 (取代盘中累计量比) ---
# 要求近 N 个【已收盘】交易日的量比【全部】达标。
# 第 i 日量比 = 第 i 日成交量 / 该日【之前】 baseline 个交易日均量，每日独立回看。
# 例: days=2 + min=1.2 → 前天和昨天的收盘量比都必须 >= 1.2。
# 分子分母均为完整交易日，口径对等，且盘中不随时间漂移。
enable_recent_volume_ratio = true
recent_volume_ratio_days = 2
min_recent_volume_ratio = 1.2
volume_ratio_baseline_days = 5

# --- (可选) 当日涨幅条件, 默认关闭 ---
enable_pct_change = false
min_pct_change = 0.05

# --- MA8 均线方向: 要求向上 ---
enable_ma8_uptrend = true

# --- 现价相对 MA8 位置: 现价 <= MA8 * ratio ---
enable_price_below_ma8_ratio = true
max_price_to_ma8_ratio = 1.07

# --- 现价相对 MA20 区间: 偏离度(现价/MA20 - 1) 须落在 [min, max] 内 ---
# 下界拦"跌离均线太远"(趋势走坏), 上界拦"追高偏离太多"(回踩风险)。
# -0.03 = MA20 下方 3%; 0.05 = MA20 上方 5%。
enable_ma20_range = true
min_price_to_ma20_deviation = -0.03
max_price_to_ma20_deviation = 0.05

# --- 涨停/停牌跳过 ---
skip_limit_up = true

# --- ST/*ST/退市整理股跳过 ---
# 按证券名称前缀判定(InstrumentStatus 不可靠: 多数 ST 股该字段同样为 0)。
# 理由: 退市风险 + 跌停幅度受限(创业板 ST 为 20%)，跌停板上止损常常无法成交，
# 实际亏损会远超 STOP_LOSS_RATIO。回测中 *ST元道 曾连续 6 个 20% 跌停。
skip_st = true

[risk]
# 已持仓该股则跳过 (查 web /api/positions)
dedup_by_position = true
# autobuy 历史 N 天内买过该股则跳过。0 = 仅当天, -1 = 永久不再买
dedup_window_days = 1
# 每次触发最多买入只数 (默认随机选 1 只)
max_buys_per_run = 1
# 模拟运行: true = 不发送真实买入请求, 其余逻辑(候选池/门禁/防重/条件检查/落库)
# 全部照常执行。模拟买入记入 buy_history 但标记 is_simulation=1, 不参与防重。
# 也可用命令行 --simulate 临时开启而不改本文件。
simulation_mode = false

[schedule]
# 触发模式: daily(每日定点) | interval(固定间隔) | both(两者都启用)
mode = both
# 每日定点时刻, 逗号分隔多个, 如 09:35,14:45
daily_times = 14:45
# 固定间隔(分钟), 仅交易时段内触发
interval_minutes = 30
# true = 非交易时段不触发(复用 config.is_trade_time())
only_trade_time = true
